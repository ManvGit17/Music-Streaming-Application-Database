<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>VaMusic</title>
    <meta
      name="description"
      content="A music streaming app built database-first on PostgreSQL 18. The demo runs the real database in your browser, and shows you the SQL behind every click."
    />
    <meta name="theme-color" content="#0d0b10" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the saved theme before first paint so the page never flashes the wrong colours.
      try {
        const saved = localStorage.getItem("vamusic.theme");
        if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>VaMusic needs JavaScript: it runs a PostgreSQL database in your browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
